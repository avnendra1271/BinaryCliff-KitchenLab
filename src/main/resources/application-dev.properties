# ===============================
# Application
# ===============================
spring.application.name=Binarycliff-kitchenlab-dev
server.port=8080

# ===============================
# Datasource (H2 for development)
# ===============================
spring.datasource.url=jdbc:h2:mem:kitchenlab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# Flyway (disabled for H2)
# ===============================
spring.flyway.enabled=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.boot=INFO
logging.level.org.springframework=INFO
logging.level.com.binarycliff.kitchenlab=DEBUG

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
