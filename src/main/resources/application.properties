# ===============================
# Application
# ===============================
spring.application.name=Binarycliff-kitchenlab
server.port=8080

# ===============================
# Multi-Tenant Configuration
# ===============================
app.tenant.header-name=X-Restaurant-ID
app.tenant.parameter-name=restaurantId
app.tenant.subdomain-enabled=true
app.tenant.default-restaurant-id=123e4567-e89b-12d3-a456-426614174000
# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/kitchenlab
spring.datasource.username=postgres
spring.datasource.password=pqsoft123
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ===============================
# Flyway
# ===============================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.table=flyway_schema_history
# ===============================
# Logging (enhanced)
# ===============================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# ===============================
# Static Resources
# ===============================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=mySecretKey123456789012345678901234567890
app.jwt.expiration=3600
app.jwt.refresh-expiration=604800
# ===============================
# Email Configuration
# ===============================
app.email.enabled=false
app.email.from=noreply@kitchenlab.com
app.email.base-url=http://localhost:8080
# ===============================